esphome:
  includes:
    - common/helpers.h

api:
  actions:
    - action: send_uart_rf_${send_pin}
      variables:
        raw_data: int[]
      then:
        - uart.write:
            id: uart_rf_${send_pin}
            data: !lambda |-
              return action_int_to_uint(raw_data);

uart:
  id: uart_rf_${send_pin}
  rx_pin: ${recv_pin}
  tx_pin: ${send_pin}
  baud_rate: 9600
  debug:
    dummy_receiver: true
    after:
      delimiter: "\r\n"
    sequence:
      - lambda: |-
          std::string result = format_vector_with_prefix(bytes);
          id(rf_code_${recv_pin}).publish_state(result);
      - delay: 200ms
      - lambda: 'id(rf_code_${recv_pin}).publish_state("reset");'

text_sensor:
  - platform: template
    id: rf_code_${recv_pin}
    name: RF code ${recv_pin}
