packages:
  rf_remote: !include
    file: rf_remote_code.yaml

external_components:
  - source:
      type: local
      path: external_components
    components: [ sw_remote_receiver, sw_remote_transmitter ]

sw_remote_receiver:
  - id: rf_receiver_${frequency_fmt}
    pin: ${recv_pin}
    tolerance: 50%
    # dump: all
    on_raw:
      - lambda: |-
          if (!id(rf_dump_${frequency_fmt}).state) return;
          const char* TAG = "RF dump ${frequency_fmt}";
          on_raw_dump(TAG, x);
    on_rc_switch:
      - lambda: |-
          std::string result = format_rc_switch_data(x);
          id(rf_code_${frequency_fmt}).publish_state(result);
      - delay: 200ms
      - lambda: 'id(rf_code_${frequency_fmt}).publish_state("reset");'

sw_remote_transmitter:
  - id: rf_transmitter_${frequency_fmt}
    pin: ${send_pin}
    carrier_duty_percent: 100%
