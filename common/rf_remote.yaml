packages:
  rf_remote: !include
    file: rf_remote_code.yaml

remote_receiver:
  - id: rf_receiver_${frequency_fmt}
    # rmt_symbols: 48 # 同时使用时需要限制内存使用
    # filter_symbols: 4
    pin: ${recv_pin}
    tolerance: 50%
    # dump: all
    on_raw:
      - lambda: |-
          if (!id(rf_dump_${frequency_fmt}).state) return;
          const char* TAG = "RF dump ${frequency_fmt}";
          on_raw_dump(TAG, x);
    on_rc_switch:
      - lambda: |-
          std::string result = format_rc_switch_data(x);
          id(rf_code_${frequency_fmt}).publish_state(result);
      - delay: 200ms
      - lambda: 'id(rf_code_${frequency_fmt}).publish_state("reset");'

remote_transmitter:
  - id: rf_transmitter_${frequency_fmt}
    pin: ${send_pin}
    carrier_duty_percent: 100%
    non_blocking: true

radio_frequency:
  - platform: ir_rf_proxy
    name: ${frequency} Transmitter
    id: tx_rf_${frequency_fmt}
    remote_transmitter_id: rf_transmitter_${frequency_fmt}
    frequency: ${frequency}
  - platform: ir_rf_proxy
    name: ${frequency} Receiver
    id: rx_rf_${frequency_fmt}
    remote_receiver_id: rf_receiver_${frequency_fmt}
    frequency: ${frequency}
