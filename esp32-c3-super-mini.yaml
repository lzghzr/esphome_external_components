substitutions:
  status_led_pin: 8

packages:
  wifi: !include
    file: common/wifi.yaml
    vars:
      ssid:  ESP32-C3 Super Mini
  esp32c3_ble: !include common/esp32c3_ble.yaml
  # ble_presence: !include common/ble_presence.yaml
  ld2401: !include
    file: common/ld2401.yaml
    vars:
      tx_pin: 2
      rx_pin: 10
  ir_remote: !include
    file: common/ir_remote.yaml
    vars:
      recv_pin: 1
      send_pin: 4
      frequency: 38 kHz
  # rf_remote_433: !include
  #   file: common/rf_remote.yaml
  #   vars:
  #     rf_recv_pin: 0
  #     rf_send_pin: 5
  #     rf_frequency: 433 MHz
  # rf_remote_315: !include
  #   file: common/rf_remote_sw.yaml
  #   vars:
  #     rf_recv_pin: 20
  #     rf_send_pin: 21
  #     rf_frequency: 315 MHz
  rf_remote_pins: !include
    file: common/rf_remote_pins_code.yaml
    vars:
      send_pins: [5, 21]
  rf_remote_433: !include
    file: common/rf_remote_pins.yaml
    vars:
      recv_pin: 0
      send_pin: 5
      frequency: 433 MHz
  rf_remote_315: !include
    file: common/rf_remote_pins.yaml
    vars:
      recv_pin: 20
      send_pin: 21
      frequency: 315 MHz

esphome:
  name: esp32-c3-super-mini
  friendly_name: ESP32-C3 Super Mini

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
  # baud_rate: 0 // esphome 文档要求关闭

# Enable Home Assistant API
api:
  encryption:
    key: !secret esp32_c3_super_mini_key

ota:
  - platform: esphome
    password: !secret esp32_c3_super_mini_password

status_led:
  pin: ${status_led_pin}
